<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="PIMS Admin — Company Approval Panel" />
  <title>Admin Panel — PIMS Portal</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>

  <div class="layout">

    <!-- ════════════════════════════════════
         SIDEBAR
         ════════════════════════════════════ -->
    <aside class="sidebar" id="sidebar" aria-label="Admin navigation">

      <div class="sidebar-header">
        <div class="sidebar-logo">
          <div class="sidebar-logo-icon">⚙️</div>
          <div>
            <div class="sidebar-logo-text">PIMS Portal</div>
            <div class="sidebar-logo-sub">Admin</div>
          </div>
        </div>
      </div>

      <nav class="sidebar-nav" aria-label="Navigation">
        <button class="sidebar-item active" aria-label="Company Approvals" disabled>
          <span class="sidebar-item-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
              <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
          </span>
          <span class="sidebar-item-text">Company Approvals</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-user-card">
          <div class="sidebar-avatar">A</div>
          <div class="sidebar-user-info">
            <div class="sidebar-user-name">Administrator</div>
            <div class="sidebar-user-role">Admin Account</div>
          </div>
        </div>
        <button class="sidebar-logout" onclick="logout()" aria-label="Sign out">
          <span class="sidebar-item-icon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
          </span>
          <span>Sign Out</span>
        </button>
      </div>

    </aside>

    <!-- Mobile sidebar backdrop -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

    <!-- ════════════════════════════════════
         MAIN CONTENT
         ════════════════════════════════════ -->
    <div class="main-content">

      <header class="page-header">
        <div class="page-header-left">
          <button class="sidebar-toggle" id="sidebarToggle"
                  onclick="toggleSidebar()" aria-label="Open navigation menu">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" aria-hidden="true">
              <line x1="3" y1="6"  x2="21" y2="6"/>
              <line x1="3" y1="12" x2="21" y2="12"/>
              <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
          </button>
          <h1 class="page-title">Company Approvals</h1>
        </div>
        <!-- Search bar -->
        <div class="page-header-right">
          <div class="input-wrapper input-icon-left" style="width:260px;">
            <span class="input-icon" aria-hidden="true">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
              </svg>
            </span>
            <input type="text" id="companySearch" class="form-control"
                   placeholder="Search companies…"
                   aria-label="Search companies"
                   oninput="filterCompanies(this.value)"
                   style="height:36px;font-size:var(--text-sm);" />
          </div>
        </div>
      </header>

      <main class="page-body">

        <!-- Tab bar: All / Pending / Approved -->
        <div class="admin-tabs" role="tablist">
          <button class="admin-tab active" id="tab-all" role="tab"
                  aria-selected="true" onclick="switchTab('all')">
            All Companies
            <span class="tab-count" id="count-all">0</span>
          </button>
          <button class="admin-tab" id="tab-pending" role="tab"
                  aria-selected="false" onclick="switchTab('pending')">
            Pending
            <span class="tab-count pending" id="count-pending">0</span>
          </button>
          <button class="admin-tab" id="tab-approved" role="tab"
                  aria-selected="false" onclick="switchTab('approved')">
            Approved
            <span class="tab-count approved" id="count-approved">0</span>
          </button>
        </div>

        <!-- Company cards container -->
        <div id="companyCards">
          <!-- skeleton loaders shown initially -->
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
        </div>

        <!-- Hidden tbody kept for DOM backward-compat (original admin.js used it) -->
        <table style="display:none" aria-hidden="true">
          <tbody id="companyTable"></tbody>
        </table>

      </main>
    </div>
  </div>

  <!-- Full-page loader -->
  <div id="loader" class="loader-overlay" role="status" aria-live="polite">
    <div class="spinner spinner-lg"></div>
    <p style="color:var(--text-muted);font-size:var(--text-sm);margin-top:12px;">Loading…</p>
  </div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/confirm.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
