<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="PIMS Company Dashboard — manage job postings and applicants." />
  <title>Company Dashboard — PIMS Portal</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/company.css" />
</head>
<body>

  <div class="layout">

    <!-- ════════════════════════════════════
         SIDEBAR
         ════════════════════════════════════ -->
    <aside class="sidebar" id="sidebar" aria-label="Company navigation">

      <div class="sidebar-header">
        <a class="sidebar-logo" href="#" onclick="navigate('dashboard')">
          <div class="sidebar-logo-icon">🏢</div>
          <div>
            <div class="sidebar-logo-text">PIMS Portal</div>
            <div class="sidebar-logo-sub">Company</div>
          </div>
        </a>
      </div>

      <nav class="sidebar-nav" aria-label="Navigation">

        <button id="nav-dashboard" class="sidebar-item active"
                onclick="navigate('dashboard')" aria-label="Dashboard">
          <span class="sidebar-item-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
              <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
            </svg>
          </span>
          <span class="sidebar-item-text">Dashboard</span>
        </button>

        <button id="nav-create" class="sidebar-item"
                onclick="navigate('create')" aria-label="Post a Job">
          <span class="sidebar-item-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="16"/>
              <line x1="8" y1="12" x2="16" y2="12"/>
            </svg>
          </span>
          <span class="sidebar-item-text">Post a Job</span>
        </button>

        <button id="nav-jobs" class="sidebar-item"
                onclick="navigate('jobs')" aria-label="My Jobs">
          <span class="sidebar-item-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <rect x="2" y="7" width="20" height="14" rx="2"/>
              <path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>
            </svg>
          </span>
          <span class="sidebar-item-text">My Jobs</span>
        </button>

        <button id="nav-applications" class="sidebar-item"
                onclick="navigate('applications')" aria-label="Applications">
          <span class="sidebar-item-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
          </span>
          <span class="sidebar-item-text">Applications</span>
        </button>

      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-user-card" id="sidebarUserCard">
          <div class="sidebar-avatar" id="sidebarAvatar">C</div>
          <div class="sidebar-user-info">
            <div class="sidebar-user-name" id="sidebarCompanyName">Company</div>
            <div class="sidebar-user-role">Company Account</div>
          </div>
        </div>
        <button class="sidebar-logout" onclick="logout()" aria-label="Sign out">
          <span class="sidebar-item-icon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
          </span>
          <span>Sign Out</span>
        </button>
      </div>

    </aside>

    <!-- Mobile sidebar backdrop -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

    <!-- ════════════════════════════════════
         MAIN CONTENT
         ════════════════════════════════════ -->
    <div class="main-content">

      <header class="page-header">
        <div class="page-header-left">
          <button class="sidebar-toggle" id="sidebarToggle"
                  onclick="toggleSidebar()" aria-label="Open navigation menu">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" aria-hidden="true">
              <line x1="3" y1="6"  x2="21" y2="6"/>
              <line x1="3" y1="12" x2="21" y2="12"/>
              <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
          </button>
          <h1 class="page-title" id="pageTitle">Dashboard</h1>
        </div>
        <div class="page-header-right" id="pageHeaderActions"></div>
      </header>

      <main class="page-body">
        <div id="content"></div>
      </main>

    </div>
  </div>

  <!-- Full-page loader -->
  <div id="loader" class="loader-overlay" role="status" aria-live="polite">
    <div class="spinner spinner-lg"></div>
    <p style="color:var(--text-muted);font-size:var(--text-sm);margin-top:12px;">Loading…</p>
  </div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/confirm.js"></script>
  <script src="js/company.js"></script>
</body>
</html>
