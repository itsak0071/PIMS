<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="PIMS Student Dashboard — manage your placement applications, jobs, and career profile." />
  <title>Student Dashboard — PIMS Portal</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/student.css" />
</head>
<body>

  <div class="layout">

    <!-- ════════════════════════════════════════════
         SIDEBAR
         ════════════════════════════════════════════ -->
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">

      <!-- Logo -->
      <div class="sidebar-header">
        <a class="sidebar-logo" href="#dashboard" onclick="navigate('dashboard')">
          <div class="sidebar-logo-icon">🎓</div>
          <div>
            <div class="sidebar-logo-text">PIMS Portal</div>
            <div class="sidebar-logo-sub">Student</div>
          </div>
        </a>
      </div>

      <!-- Nav -->
      <nav class="sidebar-nav" aria-label="Navigation">

        <button id="nav-dashboard" class="sidebar-item active"
                onclick="navigate('dashboard')" aria-label="Dashboard">
          <span class="sidebar-item-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <rect x="3" y="3" width="7" height="7"/>
              <rect x="14" y="3" width="7" height="7"/>
              <rect x="14" y="14" width="7" height="7"/>
              <rect x="3" y="14" width="7" height="7"/>
            </svg>
          </span>
          <span class="sidebar-item-text">Dashboard</span>
        </button>

        <button id="nav-jobs" class="sidebar-item"
                onclick="navigate('jobs')" aria-label="Browse Jobs">
          <span class="sidebar-item-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
              <path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>
            </svg>
          </span>
          <span class="sidebar-item-text">Browse Jobs</span>
        </button>

        <button id="nav-applications" class="sidebar-item"
                onclick="navigate('applications')" aria-label="My Applications">
          <span class="sidebar-item-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
            </svg>
          </span>
          <span class="sidebar-item-text">My Applications</span>
        </button>

        <button id="nav-profile" class="sidebar-item"
                onclick="navigate('profile')" aria-label="My Profile">
          <span class="sidebar-item-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </span>
          <span class="sidebar-item-text">My Profile</span>
        </button>

      </nav>

      <!-- Footer: user card + logout -->
      <div class="sidebar-footer">
        <div class="sidebar-user-card" id="sidebarUserCard">
          <div class="sidebar-avatar" id="sidebarAvatar">S</div>
          <div class="sidebar-user-info">
            <div class="sidebar-user-name" id="sidebarUserName">Student</div>
            <div class="sidebar-user-role">Student Account</div>
          </div>
        </div>

        <button class="sidebar-logout" onclick="logout()" aria-label="Sign out">
          <span class="sidebar-item-icon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
          </span>
          <span>Sign Out</span>
        </button>
      </div>

    </aside>

    <!-- Mobile sidebar backdrop -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

    <!-- ════════════════════════════════════════════
         MAIN CONTENT
         ════════════════════════════════════════════ -->
    <div class="main-content">

      <!-- Topbar -->
      <header class="page-header">
        <div class="page-header-left">
          <button class="sidebar-toggle" id="sidebarToggle"
                  onclick="toggleSidebar()" aria-label="Open navigation menu">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" aria-hidden="true">
              <line x1="3" y1="6"  x2="21" y2="6"/>
              <line x1="3" y1="12" x2="21" y2="12"/>
              <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
          </button>
          <h1 class="page-title" id="pageTitle">Dashboard</h1>
        </div>
        <div class="page-header-right" id="pageHeaderActions"></div>
      </header>

      <!-- Page body -->
      <main class="page-body">

        <!-- Job filter bar — shown only on Jobs section -->
        <div id="jobControls" class="filter-bar hidden"
             role="search" aria-label="Job search filters">

          <div class="input-wrapper input-icon-left" style="flex:1;min-width:180px;">
            <span class="input-icon" aria-hidden="true">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
              </svg>
            </span>
            <input type="text" id="searchInput" class="form-control"
                   placeholder="Search job title…"
                   aria-label="Search jobs by title" />
          </div>

          <select id="branchFilter" class="form-control" style="min-width:140px;"
                  aria-label="Filter by branch">
            <option value="">All Branches</option>
            <option value="CSE">CSE</option>
            <option value="ISE">ISE</option>
            <option value="ECE">ECE</option>
            <option value="ME">ME</option>
            <option value="Civil">Civil</option>
          </select>

          <select id="cgpaFilter" class="form-control" style="min-width:130px;"
                  aria-label="Filter by minimum CGPA">
            <option value="">Any CGPA</option>
            <option value="6">6.0 and above</option>
            <option value="7">7.0 and above</option>
            <option value="8">8.0 and above</option>
            <option value="9">9.0 and above</option>
          </select>

          <button class="btn btn-primary btn-sm" onclick="applyFilters()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" aria-hidden="true">
              <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
            </svg>
            Filter
          </button>
          <button class="btn btn-secondary btn-sm" onclick="clearFilters()">
            Clear
          </button>
        </div>

        <!-- Dynamic page content -->
        <div id="content"></div>

        <!-- Legacy message box — kept for DOM compatibility, toasts are used instead -->
        <div id="messageBox" class="message hidden" role="alert" aria-live="polite"></div>

        <!-- Profile section (separate div per original code) -->
        <div id="profile-section" class="hidden"></div>

      </main>
    </div><!-- /main-content -->
  </div><!-- /layout -->

  <!-- ════════════════════════════════════════════
       JOB DETAILS MODAL
       ════════════════════════════════════════════ -->
  <div id="jobModal" class="modal-overlay"
       role="dialog" aria-modal="true" aria-labelledby="jobModalTitle">
    <div class="modal modal-lg">
      <div class="modal-header">
        <h2 id="jobModalTitle">Job Details</h2>
        <button class="modal-close" onclick="closeModal()" aria-label="Close job details">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6"  y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- ════════════════════════════════════════════
       EDIT PROFILE MODAL
       ════════════════════════════════════════════ -->
  <div id="editProfileModal" class="modal-overlay"
       role="dialog" aria-modal="true" aria-labelledby="editProfileModalTitle">
    <div class="modal modal-lg">

      <div class="modal-header">
        <h2 id="editProfileModalTitle">Edit Profile</h2>
        <button class="modal-close" onclick="closeEditModal()" aria-label="Close edit profile">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6"  y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <form id="editProfileForm" class="modal-body">

        <div class="form-grid-2">
          <div class="form-group">
            <label class="form-label" for="editFullName">
              Full Name <span class="required">*</span>
            </label>
            <input type="text" id="editFullName" class="form-control"
                   placeholder="Your full name" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="editUsn">USN</label>
            <input type="text" id="editUsn" class="form-control"
                   placeholder="University Seat Number" />
          </div>
        </div>

        <div class="form-grid-2" style="margin-top:var(--sp-4);">
          <div class="form-group">
            <label class="form-label" for="editBranch">
              Branch <span class="required">*</span>
            </label>
            <input type="text" id="editBranch" class="form-control"
                   placeholder="e.g. CSE, ISE" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="editCgpa">CGPA</label>
            <input type="number" step="0.01" id="editCgpa" class="form-control"
                   placeholder="e.g. 8.5" min="0" max="10" />
          </div>
        </div>

        <div class="form-grid-2" style="margin-top:var(--sp-4);">
          <div class="form-group">
            <label class="form-label" for="editGradYear">Graduation Year</label>
            <input type="number" id="editGradYear" class="form-control"
                   placeholder="e.g. 2025" />
          </div>
          <div class="form-group">
            <label class="form-label" for="editLocation">Location</label>
            <input type="text" id="editLocation" class="form-control"
                   placeholder="City, State" />
          </div>
        </div>

        <div class="form-group" style="margin-top:var(--sp-4);">
          <label class="form-label" for="editObjective">Career Objective</label>
          <textarea id="editObjective" class="form-control"
                    placeholder="Write a brief career objective…" rows="3"></textarea>
        </div>

        <div class="form-group" style="margin-top:var(--sp-4);">
          <label class="form-label" for="editSkills">Skills</label>
          <input type="text" id="editSkills" class="form-control"
                 placeholder="e.g. Java, Python, SQL (comma separated)" />
          <span class="form-hint">Separate multiple skills with commas</span>
        </div>

        <!-- Footer inside form so submit button triggers form event -->
        <div class="edit-modal-footer">
          <button type="button" class="btn btn-secondary"
                  onclick="closeEditModal()">Cancel</button>
          <button type="submit" class="btn btn-primary"
                  id="saveProfileBtn">
            Save Changes
          </button>
        </div>

      </form>
    </div>
  </div>

  <!-- ════════════════════════════════════════════
       FULL-PAGE LOADER
       ════════════════════════════════════════════ -->
  <div id="loader" class="loader-overlay" role="status" aria-live="polite" aria-label="Loading">
    <div class="spinner spinner-lg"></div>
    <p style="color:var(--text-muted);font-size:var(--text-sm);margin-top:12px;">
      Loading…
    </p>
  </div>

  <!-- Scripts — order is critical -->
  <script src="js/config.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/confirm.js"></script>
  <script src="js/student.js"></script>
</body>
</html>
